  - id: A2
    source: specs/p2-array-chunking/spec.md
    text: 大网格走分块路径（验收：A2）【离线】 est ≥ 64,000,000 时走分块路径：`open_dataset` 收到显式
      `io_chunks`，其值由 **块尺寸纯函数** `plan_chunks(width, height, n_periods,
      n_bands)` 计算——确定性 （同输入同输出）、无 IO、无全局态，形状映射到 xee 的 `(index=期块, width=x块,
      height=y块)`；空间优先大块、期维装满剩余预算，块尺寸不必 整除网格（xee 自行处理边缘块）。读取按（期块×空间块）两级循环执行：
      lazy 打开 → 逐块 `isel(...).values` → 直写预分配 netCDF4 变量切片 → 每块后
      `job.check_cancelled()` 并更新 `job.progress`。离线单测以 monkeypatch 断言
      `open_dataset` 的 io_chunks 参数、循环块数与块形状均来自 `plan_chunks`。 运行时强制开关
      `GEOCODE_ARRAY_PATH`（环境变量，默认 `auto`）：`direct` 强制现状 路径、`chunked` 强制分块路径（用于
      A5 交叉验证）。它是测试钩子——不进 `ArtifactSpec`、不进指纹、不进 daemon/TUI 工具面；非法值报可读错误。
    result: passed
    reason:
      text: plan_chunks 纯函数确定性/无 IO/无全局态（单测钉死 8200×8200×1×3 →
        {index:1,width:1672,height:1672}，内含请求侧硬校验断言）；_array_path_mode 阈值
        est≥MAX_DIRECT_PIXELS→chunked（64M 边界归 chunked 有测试）；GEOCODE_ARRAY_PATH 强制
        direct/chunked、非法值报可读 ValueError；分块路径经 _open_ee_dataset_lazy 在
        open_dataset 时显式传 io_chunks，期×空间块循环 isel→values→netCDF4 预分配直写，每块
        check_cancelled+progress（diff 核实）；单测断言 io_chunks==plan_chunks 输出、auto
        大网格走 chunked、块步长铺满不整除网格；真实 GEE 大网格 8244×8253@10m 以
        io_chunks={1,1672,1672} 25/25 块完成（big_smoke_log.txt）。
      truncated: false
