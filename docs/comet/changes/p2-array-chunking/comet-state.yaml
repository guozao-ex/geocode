  - id: A4
    source: specs/p2-array-chunking/spec.md
    text: 内存有界——预算上界与实测对照（验收：A4）【上界离线；实测需网络，已标注】 单块驻留字节 = 块像素 × 4B ≤ **32 MiB**
      预算常量（≈8.39M 像素/块）；请求侧 = 块像素 × 5B ≤ 48 MB（GEE 单请求上限；32 MiB
      预算下自动满足，`plan_chunks` 内保留断言防御预算上调）。离线单测对边界输入（单期/多期、极窄/极宽网格、 超阈值网格）断言
      `plan_chunks` 输出满足两个上限且确定。读入阶段峰值上界 = 单块驻留 + 写缓冲（常数级）——大网格 smoke
      实测读入阶段内存峰值（记录数值与 采样方式），对照公式上界（容差 ≤ 2×），并在验收报告留档。落盘为逐块增量写， 不整期/全量驻留（D4
      裁决：两级分块直写 netCDF4）。
    result: passed
    reason:
      text: 离线：TestPlanChunks 对 9 组边界输入断言块像素×波段×4B≤32MiB、×5B≤48MB 且确定；plan_chunks
        内请求侧超限 AssertionError 防御；逐块增量直写、不整期/全量驻留（两级循环结构核实）。实测：大网格 psutil 0.2s 采样
