    text: "A1: `tools/verify_facts_check.py` 在「报告与盘上事实一致」时退出码 0、零违规；人为制造一处违规 （把某条
      `skip_reason` 改成与盘上相反的说法）后，退出码 1，且输出能指出是**哪个检查项**的**哪条断言**失败。
      破坏性自证：不只给「全对时通过」的证据，还要保留「错的时候真的会红」的前后对照输出。"
    result: passed
    reason:
      text: 独立复跑：worktree 报告 logs/verify_all_report.json（13 项）→ EXIT=0，stdout「全部通过：13
        个检查项在 G1-G4 / P1-P7 上零违规」。自建 doctored 副本（仅把 smoke-map-renderers-qgis 的
        skip_reason 改成「已命中…在盘」，盘上实为空）→ EXIT=1，--json 精确点名
        {"id":"P5","check":"smoke-map-renderers-qgis","assertion":"cache_probe
        措辞与盘上事实一致","message":"前置产物缺失（data/derived/s2_beijing_test.b91c09c9.tif：exists=False，size=0
        B，阈值 4096 B），但 skip_reason 出现「命中」"}；把同一副本措辞还原为真实文本 → 回到
        EXIT=0，前后对照两侧齐备。另做反向失配：--facts-root D:/DEV/geocode 时同一报告声称「不存在」而主工作区盘上确有
        4633924 B 该产物 → EXIT=1、2 条 P5 点名 qgis 与 arcpy；主工作区 2026-10-14 旧报告（缺
        probe 字段）→ EXIT=1、12 条 P1 逐项点名。Builder 的 c19_a1_doctored.json 我单独复跑同样
        EXIT=1、同一条 P5。
      truncated: false
