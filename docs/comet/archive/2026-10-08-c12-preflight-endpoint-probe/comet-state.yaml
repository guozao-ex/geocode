    reason:
      text: 独立 harness：无监听端口 ->
        ok=False、code=pro-mcp-not-listening、listening=False、endpoint_alive=False、endpoint_error='无监听者'
        且不发 HTTP（_mcp_endpoint_alive 未被调用，见
        tests/unit/test_preflight_pro_endpoint.py::CheckProAddinWiringTest.test_A1_not_listening_reports_baseline_code）。证据：%TEMP%/c12-verifier/probe_harness.py
        'no-listener' PASS。
      truncated: false
  - id: A2
    source: brief.md
    text: '**A2（离线）原始 socket 监听者占住端口**（accept 后不回 HTTP）→ `ok=False`、报**新的占用类失败码**（与
      `pro-mcp-not-listening` 可区分）、reason 含可执行排查动作（netstat/PID
      或换端口）、`value["listening"] is True` 且端点字段为 False。'
    result: passed
    reason:
      text: 独立 harness 起真原始/非 HTTP 监听者：ok=False、code=pro-port-occupied-by-other（!=
        pro-mcp-not-listening）、listening=True（诊断保留）、endpoint_alive=False、reason
        以「症状：」开头且含 netstat -ano|findstr:<port> 与 GEOCODE_PRO_PORT
        换端口两条处置。证据：probe_harness.py 'occupied(non-http)'、'raw-only-listen' PASS。
      truncated: false
  - id: A3
    source: brief.md
    text: '**A3（离线）HTTP 返回 200 + 合法 JSON 但 `name != "geocode-pro"`** → 与 A2 同判（不是本
      add-in 端点），不得报就绪。'
    result: passed
    reason:
      text: 独立 harness：HTTP 200 + 合法 JSON 但 name='other-svc' -> alive=False、name 记录为
        other-svc、err 含该值，不报就绪。另有非 HTTP、404、非 JSON body、JSON 数组分支均
        False。证据：probe_harness.py
        'mode=wrongname'/'badjson'/'listjson'/'status404' PASS。
      truncated: false
