  - id: A7
    source: specs/p2-timeseries/spec.md
    text: 'spec 校验与序列化（验收：A7）【离线】 `ArtifactSpec` 新增两个互斥时序字段： - `time_step: "day" |
      "week" | "month" | "year" | None`——节奏切片模式：以 `time_range[0]` 为起点，第 i 期窗口 =
      `[t0 + i·step, t0 + (i+1)·step)`；期起点 < t1 的期全部生成（N 由 起止÷步长
      确定性推导）；最后一期窗口终点可越过 `time_range[1]`
      至多一个步长（保证末段覆盖完整）。月/年步进用年月加法，日超过当月天数时钳制到月末； 日/周步进用 timedelta。 -
      `time_ranges: tuple[tuple[str, str], ...] | None`——显式多段模式：N =
      len(time_ranges)， 期 i 窗口 = 条目 i 原样使用；允许不等长窗口，不禁止间隔或重叠（显式列表即契约）。
      校验（SpecError 消息写清怎么修）：`time_step` 取值必须是四个步长之一（消息列出可选项）； `time_step`
      设置时必须提供 `time_range`；`time_ranges` 每个条目必须是 (起, 止) 且 起 ≤ 止；两字段同时设置报互斥错误；期数
      N > `MAX_TIME_PERIODS`（=120）报错（提示 缩短范围或加大步长）。任一字段设置即进入时序模式（`is_collection`
      为真）。 `to_dict`/`from_dict` 对两字段往返保真（None/元组/列表语义不丢）。 `emit_map` 对时序
      spec（任一时序字段非 None）报可读 SpecError：说明 map 出口暂不支持 时序，并给出生路（单期 spec 或等待后续
      change）；不静默塌缩、不产出歧义产物。'
    result: passed
    reason:
      text: test_spec_timeseries 23 用例随全量绿：互斥、非法步长、缺 time_range、起>止、N>120 上限（收敛于
