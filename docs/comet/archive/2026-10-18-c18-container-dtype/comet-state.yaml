acceptance:
  - id: A1
    source: brief.md
    text: "A1: 同一 spec 的 `emit_file`（GeoTIFF）与 `emit_array`（NetCDF）容器 dtype 一致，且等于按
      Q1 选定 语义推导出的期望值（例如 `container_dtype=float32` 时两边都是 float32）。"
    result: passed
    reason:
      text: 两出口共用 gis/container.py::resolve_container 单源解析。独立离线实测（自建 spec）：显式 float32
        → GeoTIFF ds.dtypes=['float32'] 且 NetCDF B4=float32；显式 float64 →
        ['float64'] 且 float64；缺省不声明 → 两边 float32（且 to_dict 不带该键）。时序堆叠路径离线跑通
        _merge_stack(container='float32')：输出 ['float32','float32']、nodata=NaN、值
        0.125/0.5 保持，container=None 时仍为历史 float64。未执行：GeoTIFF 分块拼接（emit.py:793
        由首个 tile 继承容器，tile 已在 _fetch_tif 落契约）与 NetCDF 分块写入（emit.py:1471
        np.dtype(container)）为代码审查，需 GEE。
      truncated: false
  - id: A2
    source: brief.md
    text: 'A2: 量纲守卫生效：对"数据为 0–1 小数、却声明整数容器"的 spec，产物不得被静默量化 ——
      必须报出可读错误（或按选定语义降级为浮点并明确告警），且有离线用例覆盖该判定。'
    result: passed
    reason:
      text: 自建破坏性输入（不读测试名）：guard_container_capacity([[0.0695,0,1],[0.5,nan,0.25]],'uint16')
        抛 SpecError，消息含首个越界样值 0.0695、越界像元计数与「改法：float32/float64」；含 NaN + int32
        亦拒；浮点容器与「整数数据+整数容器」放行（不误伤）。真实写盘路径：spec(dtype=uint16,
        container_dtype=uint16)（过静态校验）在 _apply_container_to_geotiff 抛
        SpecError，被测文件 sha 与 mtime 不变、无 .part 残留＝写盘前拦下。monkeypatch
        绕过契约层（resolve_container→'uint16'）后采样守卫仍拦下同一输入，证明拦阻来自实测采样而非只看声明。静态层另行拒
        dtype=float32+container=uint16 的自相矛盾声明。
      truncated: false
