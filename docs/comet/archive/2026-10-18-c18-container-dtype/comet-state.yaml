      金指纹不回退"判。实测必须打在 **S2 真彩色**那条（现状 GeoTIFF float64 → 契约 float32
      才是真验证）；DEM（现状已 float32）与 WorldCover（同样 float32）只能作旁证，不得单独充数。'
