        destination=Drive/gexports/s2_pilot_big.6ffc30ee*，task
        S3ESI2YKUM5FOBB6C2AGNRNV 创建成功（本轮以 ee.data.getTaskStatus 只读复核该任务真实存在于
        GEE，state=CANCELLED 为后续 A7 取消所致）；export 路径不受 MAX_DIRECT_PIXELS 限制（grep
        确认该常量仅在 emit.py:124 报错分支），emit.py 零改动故 file 出口 64M 报错路径原样保留
